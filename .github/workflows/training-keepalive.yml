name: Training DB keep-alive

# Supabase free projects pause after a week without activity, which takes the
# training site down. A tiny daily read keeps the project awake.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "https://dsgzqdznntsriaezmlbn.supabase.co/rest/v1/rpc/keepalive" \
            -X POST -H "Content-Type: application/json" -d '{}' \
            -H "apikey: sb_publishable_HxWnLtIFqNZRRg1O1QFWHg_Lkrw-TSv"
